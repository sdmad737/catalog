# Change this name if it is already taken in your Fly.io account.

app = "catalog-sdmad737"
kill_signal = "SIGINT"
kill_timeout = 5
processes = []

[build.args]
  COMMIT = "HEAD"
  VERSION = "nightly"

[env]
  PORT = "7745"
  CATALOG_DEMO = "true"

[experimental]
  allowed_public_ports = []
  auto_rollback = true

[[services]]
  http_checks = []
  internal_port = 7745
  processes = ["app"]
  protocol = "tcp"
  script_checks = []
  [services.concurrency]
    hard_limit = 25
    soft_limit = 20
    type = "connections"

  [[services.ports]]
    force_https = true
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.tcp_checks]]
    grace_period = "1s"
    interval = "15s"
    restart_limit = 0
    timeout = "2s"
