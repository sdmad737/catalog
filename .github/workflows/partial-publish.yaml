name: Frontend / E2E

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      release:
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: "Publish Catalog"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@v3
        with:
          image: tonistiigi/binfmt:latest
          platforms: all

      - name: install buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build nightly image
        if: ${{ inputs.release == false }}
        run: |
          docker build --push --no-cache \
            --tag=ghcr.io/sdmad737/catalog:${{ inputs.tag }} \
            --build-arg=COMMIT=$(git rev-parse HEAD) \
            --build-arg=BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
            --platform=linux/amd64,linux/arm64,linux/arm/v7 .

      - name: build nightly-rootless image
        if: ${{ inputs.release == false }}
        run: |
          docker build --push --no-cache \
            --tag=ghcr.io/sdmad737/catalog:${{ inputs.tag }}-rootless \
            --build-arg=COMMIT=$(git rev-parse HEAD) \
            --build-arg=BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
            --file Dockerfile.rootless \
            --platform=linux/amd64,linux/arm64,linux/arm/v7 .

      - name: build release tagged the image
        if: ${{ inputs.release == true }}
        run: |
          docker build --push --no-cache \
            --tag ghcr.io/sdmad737/catalog:nightly \
            --tag ghcr.io/sdmad737/catalog:latest \
            --tag ghcr.io/sdmad737/catalog:${{ inputs.tag }} \
            --build-arg VERSION=${{ inputs.tag }} \
            --build-arg COMMIT=$(git rev-parse HEAD) \
            --build-arg BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
            --platform linux/amd64,linux/arm64,linux/arm/v7 .

      - name: build release tagged the rootless image
        if: ${{ inputs.release == true }}
        run: |
          docker build --push --no-cache \
            --tag ghcr.io/sdmad737/catalog:nightly-rootless \
            --tag ghcr.io/sdmad737/catalog:latest-rootless \
            --tag ghcr.io/sdmad737/catalog:${{ inputs.tag }}-rootless \
            --build-arg VERSION=${{ inputs.tag }} \
            --build-arg COMMIT=$(git rev-parse HEAD) \
            --build-arg BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
            --platform linux/amd64,linux/arm64,linux/arm/v7  \
            --file Dockerfile.rootless .
